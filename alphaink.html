  <body class="bg-ink-50 text-ink-900 antialiased">
    <style>
      .ai-boot {
        position: fixed; inset: 0; display: flex; align-items: center;
        justify-content: center; flex-direction: column; gap: 12px;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #f6f7f9; color: #3f4859;
      }
      .ai-boot .mark {
        width: 44px; height: 44px; border-radius: 10px; background: #0c0e13;
        color: #fff; display: flex; align-items: center; justify-content: center;
        font-weight: 700; font-size: 22px;
      }
      .ai-boot small { color: #818ea3; font-size: 12px; }
    </style>
    <div id="root">
      <div class="ai-boot" id="ai-boot">
        <div class="mark">α</div>
        <div id="ai-boot-msg">AlphaInk — Caricamento…</div>
        <small id="ai-boot-hint">Attendere qualche secondo…</small>
      </div>
    </div>
    <script>
      window.__AI_BOOT_T0 = Date.now();
      window.addEventListener('error', function (e) {
        var hint = document.getElementById('ai-boot-hint');
        var msg = document.getElementById('ai-boot-msg');
        if (hint && msg) {
          msg.textContent = 'Errore di avvio';
          hint.textContent = String((e && e.message) || e) + ' — apri la console del browser per il dettaglio.';
          hint.style.color = '#b91c1c';
        }
      });
      setTimeout(function () {
        var b = document.getElementById('ai-boot');
        if (!b || !document.body.contains(b)) return; // React ha montato
        var hint = document.getElementById('ai-boot-hint');
        var msg = document.getElementById('ai-boot-msg');
        if (msg) msg.textContent = 'Avvio non riuscito';
        if (hint) {
          hint.innerHTML =
            'Il bundle JavaScript non si è avviato. Possibili cause:<br>' +
            '• il file è stato aperto da disco (file://) — usa invece <code>npm run dev</code> oppure servi la cartella <code>dist/</code><br>' +
            '• la cache del browser è sporca — ricarica con Ctrl/Cmd + Shift + R<br>' +
            '• un errore JS — apri la console (F12) per il dettaglio';
          hint.style.color = '#b91c1c';
          hint.style.maxWidth = '520px';
          hint.style.textAlign = 'center';
          hint.style.lineHeight = '1.5';
        }
      }, 4000);
    </script>
  </body>
