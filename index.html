<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0e13" />

  <body class="bg-ink-50 text-ink-900 antialiased">
    <style>
      .ai-boot {
        position: fixed; inset: 0; display: flex; align-items: center;
        justify-content: center; flex-direction: column; gap: 12px;

        background: #f6f7f9; color: #3f4859;
      }
      .ai-boot .mark {
        width: 44px; height: 44px; border-radius: 10px; background: #0c0e13;
        color: #fff; display: flex; align-items: center; justify-content: center;
        font-weight: 700; font-size: 22px;
      }
      .ai-boot small { color: #818ea3; font-size: 12px; }
    </style>
    <div id="root">
      <div class="ai-boot">
        <div class="mark">α</div>
        <div>AlphaInk — Caricamento…</div>
        <small>Se questa schermata resta visibile, apri la console per vedere eventuali errori.</small>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
